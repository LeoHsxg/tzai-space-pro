# Cloudflare Worker 設定檔——wrangler CLI 讀這份檔決定「部署什麼、綁定什麼資源」。
# 部署步驟見 docs/guestbook-cloudflare-workers-plan.md

name = "tzai-guestbook"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# D1 資料庫綁定：程式碼裡的 env.DB 就是這裡宣告的 binding。
# database_id 要先執行 `wrangler d1 create tzai-guestbook`，把回傳的 id 貼進來。
[[d1_databases]]
binding = "DB"
database_name = "tzai-guestbook"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# 環境變數（非機密；機密要用 `wrangler secret put`，這裡三個都不是機密）
[vars]
FIREBASE_PROJECT_ID = "tzai-space-pro"
# 逗號分隔的管理員 email 清單（可刪任何人的留言）
ADMIN_EMAILS = "leosimba9487@gmail.com"
# 逗號分隔的允許來源（正式站網域 tzai-space.com 的 DNS 在 Cloudflare 上，
# apex 與 www 都放進白名單；localhost 留著方便本地開發）
ALLOWED_ORIGINS = "http://localhost:3000,https://tzai-space.com,https://www.tzai-space.com"

# （建議）把 Worker 綁上自訂子網域，取代預設的 *.workers.dev 網址。
# 前提：tzai-space.com 這個 zone 跟 Worker 在同一個 Cloudflare 帳號。
# 部署時 wrangler 會自動建立 DNS 紀錄與憑證。要啟用就把下面的註解拿掉：
# routes = [
#   { pattern = "guestbook.tzai-space.com", custom_domain = true }
# ]
